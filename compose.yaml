# ==============================================================================
# PressingOS — Docker Compose pour PostgreSQL Local
# ==============================================================================
# Usage :
#   Démarrer la base : docker compose up -d
#   Vérifier l'état : docker compose ps
#   Consulter les logs : docker compose logs -f db
#   Arrêter sans perte : docker compose down
#   Arrêter et réinitialiser les volumes : docker compose down -v (ATTENTION : efface les données)
# ==============================================================================

name: pressing-os-local

services:
  db:
    image: postgres:16-alpine
    container_name: pressingos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pressing_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pressing_secret_local_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-pressing_os}
    ports:
      # Exposition locale sécurisée (127.0.0.1 uniquement, jamais exposé sur 0.0.0.0)
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pressing_app} -d ${POSTGRES_DB:-pressing_os}']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: pressingos_postgres_data
